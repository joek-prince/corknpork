<style>
/* Layout: a fantasy network's league page. Maroon brand bar, dark section nav with a gold underline, a scoreboard ticker,
   then the content on raised panels. Headlines and every number are set in Barlow Condensed; the wordmark keeps the
   varsity Graduate face from the link-preview card. Fixed dark theme like a sports app, no light variant. */
:root{
  --bg:#111821; --surface:#1A222D; --raised:#212B38; --stripe:#1E2733; --line:#2B3645; --line2:#3B4859;
  --ink:#F3F5F8; --muted:#9BA7B6; --dim:#6F7C8C;
  --maroon:#8C2B3B; --maroon-deep:#621C2A; --maroon-hi:#D6566D;
  --gold:#DDB862; --gold-soft:rgba(221,184,98,.16);
  --win:#4CC38A; --loss:#F0616A; --live:#FF5563;
  --font-head:"Barlow Condensed","Arial Narrow","Helvetica Neue",Arial,sans-serif;
  --font-body:"Barlow","Helvetica Neue",Arial,sans-serif;
  --font-mark:"Graduate","Rockwell","Georgia",serif;
  --font-data:var(--font-head);
  --accent:var(--maroon-hi); --brass:var(--gold);
  color-scheme:dark;
}

*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.45;
  padding-bottom:calc(40px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{text-wrap:balance;margin:0}
td,th,.num{font-variant-numeric:tabular-nums}
a{color:var(--gold)}
button,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:2px}
.sr{position:absolute;left:0;top:0;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---- brand bar ---- */
.brand{background:linear-gradient(180deg,var(--maroon),var(--maroon-deep));padding-top:env(safe-area-inset-top,0px);
  box-shadow:inset 0 -1px 0 rgba(0,0,0,.35)}
.brand .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:60px}
.lockup{display:flex;align-items:center;gap:12px;min-width:0;text-decoration:none;color:#fff}
.lockup svg{width:34px;height:34px;flex:0 0 auto;filter:drop-shadow(0 1px 0 rgba(0,0,0,.35))}
.lockup .mark{font-family:var(--font-mark);font-size:21px;line-height:1;letter-spacing:.02em;white-space:nowrap}
.lockup .mark small{display:block;font-family:var(--font-head);font-weight:700;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);margin-top:4px}
.me-pick{display:flex;align-items:center;white-space:nowrap}
.me-pick select{min-height:36px;max-width:170px;background:rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.22);color:#fff;border-radius:3px;padding:0 8px;font-family:var(--font-head);font-weight:600;font-size:15px}
.me-pick select.unset{border-color:var(--gold)}

/* ---- section nav ---- */
.tabs{position:sticky;top:0;z-index:5;background:#0C1117;border-bottom:1px solid var(--line);display:flex;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs::after{content:"";flex:0 0 24px}
.tabs-inner{display:flex;max-width:1180px;margin:0 auto;width:100%;padding-left:max(2px,env(safe-area-inset-left,0px));padding-right:max(2px,env(safe-area-inset-right,0px))}
.tab{flex:0 0 auto;min-height:46px;border:0;background:none;padding:0 14px;cursor:pointer;
  font-family:var(--font-head);font-weight:700;font-size:16px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);
  box-shadow:inset 0 -3px 0 transparent}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink);box-shadow:inset 0 -3px 0 var(--gold)}

/* ---- scoreboard ticker ---- */
.ticker{background:var(--surface);border-bottom:1px solid var(--line);margin-bottom:22px}
.ticker-in{display:flex;align-items:stretch;overflow-x:auto;scrollbar-width:none;max-width:1180px;margin:0 auto}
.ticker-in::-webkit-scrollbar{display:none}
.tk-lbl{position:sticky;left:0;z-index:1;flex:0 0 auto;display:flex;flex-direction:column;justify-content:center;gap:2px;padding:8px 12px;
  background:var(--maroon);color:#fff;font-family:var(--font-head);font-weight:800;font-size:14px;letter-spacing:.06em;text-transform:uppercase;line-height:1.1;
  box-shadow:4px 0 10px rgba(0,0,0,.3)}
.tk-lbl small{font-weight:600;font-size:11px;letter-spacing:.1em;color:rgba(255,255,255,.75)}
.tk{flex:0 0 auto;display:grid;grid-template-columns:auto 1fr auto;grid-auto-rows:min-content;align-items:center;gap:2px 8px;min-width:152px;padding:8px 12px;border:0;border-right:1px solid var(--line);
  background:none;color:var(--muted);text-align:left;cursor:pointer;font-family:var(--font-head);font-size:14px}
.tk:hover{background:var(--raised)}
.tk .st{grid-column:1/-1;font-weight:700;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);display:flex;align-items:center;gap:6px}
.tk .st.live{color:var(--live)}
.tk .nm{font-weight:600;letter-spacing:.02em;white-space:nowrap}
.tk .pt{font-weight:700;font-size:15px;text-align:right}
.tk .w .nm,.tk .w .pt{color:var(--ink)}
.tk .w .pt{font-weight:800}
.tk .av{width:18px;height:18px;font-size:8px}
.tk .r{display:contents}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--live);box-shadow:0 0 0 0 rgba(255,85,99,.6)}
@media (prefers-reduced-motion:no-preference){.dot{animation:pulse 1.6s ease-out infinite}@keyframes pulse{to{box-shadow:0 0 0 6px rgba(255,85,99,0)}}}

/* ---- team avatars: ESPN logo when the data has one, otherwise a monogram tile in the team's own hue ---- */
.av{position:relative;display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;width:28px;height:28px;border-radius:50%;
  background:var(--c,#3A4756);color:#fff;font-family:var(--font-head);font-weight:800;font-size:11px;letter-spacing:.02em;overflow:hidden;vertical-align:middle;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#fff}

/* ---- week hero ---- */
.hero{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px 28px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.hero-wk{display:flex;align-items:center;gap:14px}
.hero-wk .big{font-family:var(--font-head);font-weight:800;font-size:clamp(54px,9vw,88px);line-height:.9;letter-spacing:.01em;text-transform:uppercase;
  padding-left:14px;border-left:6px solid var(--maroon-hi)}
.hero-txt{display:grid;gap:4px;max-width:56ch}
.hero-txt b{font-family:var(--font-head);font-weight:700;font-size:20px;letter-spacing:.02em;text-transform:uppercase}
.hero-txt p{margin:0;color:var(--muted);font-size:14.5px}
.live-tag{display:inline-flex;align-items:center;gap:7px;font-family:var(--font-head);font-weight:800;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--live)}

section.view{display:grid;gap:32px}
section.view>*,.block>*{min-width:0}
.block{display:grid;gap:12px;min-width:0;align-content:start}
.block-head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 16px}
.block h2{font-family:var(--font-head);font-weight:800;font-size:26px;line-height:1;letter-spacing:.02em;text-transform:uppercase;display:flex;align-items:center;gap:10px}
.block h2::before{content:"";width:5px;height:22px;background:var(--maroon-hi);flex:0 0 auto}
.note{color:var(--muted);font-size:14px;margin:0;max-width:72ch}
.banner{background:var(--gold-soft);border-left:4px solid var(--gold);padding:12px 16px;border-radius:0 3px 3px 0}

/* ---- award stat sheet: one grid with shared hairlines, not floating cards ---- */
.awards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr));background:var(--surface);border:1px solid var(--line);border-radius:4px;overflow:hidden}
.award{padding:12px 14px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);margin:0 -1px -1px 0;display:grid;grid-template-columns:auto 1fr;gap:2px 12px;align-items:center;align-content:start;min-width:0}
.award .k{grid-column:1/-1;font-family:var(--font-head);font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.award .v{font-family:var(--font-head);font-weight:800;font-size:34px;line-height:1;min-width:70px}
.award .d{font-size:14px;line-height:1.3;overflow-wrap:anywhere;min-width:0}
.award .d small{display:block;color:var(--muted);font-size:13px}
.award.hot .v{color:var(--gold)}

/* ---- matchup cards shaped like a scoreboard ---- */
.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr));gap:10px}
.game{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:0 0 10px;display:grid;gap:6px;min-width:0}
.game .gh{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 12px;background:var(--raised);border-bottom:1px solid var(--line);
  font-family:var(--font-head);font-weight:700;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.game .gh .live-tag{font-size:12px}
.side{display:grid;grid-template-columns:auto 1fr auto;gap:0 10px;align-items:center;padding:3px 12px}
.side .av{grid-row:1/span 2}
.side .tn{font-weight:600;line-height:1.2;overflow-wrap:anywhere;min-width:0;display:flex;align-items:center;gap:6px}
.side .on{color:var(--muted);font-size:13px;grid-column:2}
.side .sc{font-family:var(--font-head);font-weight:800;font-size:26px;line-height:1;grid-row:1/span 2;grid-column:3;text-align:right;display:flex;align-items:center;gap:8px}
.side.lose .tn,.side.lose .sc{color:var(--muted);font-weight:500}
.side.lose .av{opacity:.6}
.chip.wl{background:var(--win);color:#0B1A12;font-size:11px;padding:0 5px;line-height:16px;border-radius:2px}
.side .tn .wl{order:2}
.game .meta{margin:4px 12px 0;border-top:1px dashed var(--line);padding-top:8px;font-size:13px;color:var(--muted);display:grid;gap:5px}
.split{height:5px;margin:2px 12px 0;background:var(--raised);overflow:hidden;display:flex;border-radius:2px}
.split i{display:block;height:100%;background:var(--maroon-hi)}
.split i+i{background:var(--gold)}
.alert{color:var(--loss);font-weight:600}
.pv .side .tn::before{content:"";display:inline-block;width:8px;height:8px;border-radius:1px;background:var(--maroon-hi);flex:0 0 auto}
.pv .side+.side .tn::before{background:var(--gold)}

/* ass clenchers: the write-ups */
.stories{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,460px),1fr));gap:10px}
.story{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:0 0 12px;display:grid;gap:8px;min-width:0}
.story.hot{border-left:4px solid var(--live)}
.story.me{box-shadow:inset 0 0 0 2px var(--gold)}
.story .tag{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;padding:8px 12px;background:var(--raised);border-bottom:1px solid var(--line);
  font-family:var(--font-head);font-weight:600;font-size:13px;letter-spacing:.04em;color:var(--muted)}
.story h3{font-family:var(--font-head);font-size:20px;font-weight:700;line-height:1.2;text-wrap:balance;padding:4px 12px 0}
.story p{margin:0;padding:0 12px;font-size:14.5px;line-height:1.5;max-width:70ch}
.story .left{display:grid;gap:3px;margin:0 12px;border-top:1px dashed var(--line);padding-top:8px;font-size:13px;color:var(--muted)}
.story .left b{color:var(--ink);font-weight:600}
.chip.hot{background:rgba(255,85,99,.18);color:var(--live)}
.ledger td.tight{color:var(--gold);font-weight:800}
.block h3.sub{font-family:var(--font-head);font-weight:700;font-size:15px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:6px}
.chip{display:inline-block;font-family:var(--font-head);font-weight:700;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;padding:1px 6px;border-radius:2px;background:var(--raised);color:var(--muted);line-height:17px}
.chip.w{background:rgba(76,195,138,.18);color:var(--win)}
.chip.l{background:rgba(240,97,106,.18);color:var(--loss)}

/* ---- stat tables: striped, condensed, sticky team column ---- */
.tbl-wrap{position:relative;overflow-x:auto;border:1px solid var(--line);border-radius:4px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-family:var(--font-head);font-size:15px}
caption{text-align:left}
th,td{padding:8px 10px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line);background:var(--row,var(--surface))}
thead th{font-weight:700;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);background:var(--raised);border-bottom:2px solid var(--line2)}
tbody tr:nth-child(even){--row:var(--stripe)}
tr:last-child td{border-bottom:0}
td.l,th.l{text-align:left}
td.team{text-align:left;white-space:normal;min-width:190px;font-family:var(--font-body)}
td.team .tc{display:flex;align-items:center;gap:9px}
td.team .av{width:26px;height:26px;font-size:10px}
td.team .tc>span{min-width:0}
td.team b{font-weight:600;display:block;line-height:1.2}
td.team .tc>span>span{color:var(--muted);font-size:13px;display:block}
.sticky1 th:first-child,.sticky1 td:first-child{position:sticky;left:0;z-index:1;box-shadow:inset -1px 0 0 var(--line)}
tr.cut td{border-bottom:2px solid var(--maroon-hi)}
th.sortable{cursor:pointer;user-select:none}
th.sortable:hover,th.sortable[aria-sort]{color:var(--ink)}
.rk{display:inline-flex;align-items:center;justify-content:center;min-width:24px;height:22px;padding:0 5px;border-radius:3px;background:var(--raised);font-weight:800;font-size:14px}
.rk.top{background:var(--gold);color:#1A1406}
.up{color:var(--win)} .down{color:var(--loss)} .flat{color:var(--dim)}
.pos{color:var(--win)} .neg{color:var(--loss)}
.muted{color:var(--muted)}

/* highlight my team */
tr.me{--row:#2E2A1F}
tr.me td:first-child{box-shadow:inset 3px 0 0 var(--gold),inset -1px 0 0 var(--line)}
.game.me,.award.me,.plaque.me{box-shadow:inset 0 0 0 2px var(--gold)}
.rec li.me{background:var(--gold-soft);border-radius:3px}

/* heatmap */
.heat td.c{min-width:62px;text-align:center;font-weight:700;color:var(--ink)}
.heat td.c small{display:block;font-size:11.5px;font-weight:600;letter-spacing:.04em;color:rgba(255,255,255,.7)}

/* champion plaques */
.plaques{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr));gap:12px}
.plaque{background:linear-gradient(180deg,var(--raised),var(--surface));border:1px solid var(--line);border-top:3px solid var(--gold);border-radius:4px;padding:14px 16px;display:grid;gap:6px;align-content:start;min-width:0}
.plaque .yr{font-family:var(--font-head);font-weight:800;font-size:40px;line-height:.95;color:var(--gold);display:flex;align-items:center;gap:10px}
.plaque .yr svg{width:26px;height:26px}
.plaque .ch{font-family:var(--font-head);font-weight:700;font-size:21px;line-height:1.15;overflow-wrap:anywhere}
.plaque .who{color:var(--muted);font-size:13.5px}
.plaque .fin{font-family:var(--font-head);font-size:15px;color:var(--muted)}
.plaque dl{margin:4px 0 0;display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:13px;border-top:1px solid var(--line);padding-top:8px}
.plaque dt{color:var(--muted)} .plaque dd{margin:0;overflow-wrap:anywhere}
.titles{font-family:var(--font-head);font-weight:700;color:var(--gold);letter-spacing:.08em}

/* record book panels */
.recgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));gap:12px}
.rec{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:0 14px 6px;display:grid;gap:4px;align-content:start;min-width:0}
.rec h3{font-family:var(--font-head);font-weight:700;font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:10px 0 8px;border-bottom:2px solid var(--line2)}
.rec ol{margin:0;padding:0;list-style:none;display:grid}
.rec li{display:grid;grid-template-columns:auto 1fr;gap:0 12px;align-items:baseline;padding:7px 4px;margin:0 -4px;border-bottom:1px solid var(--line)}
.rec li:last-child{border-bottom:0}
.rec li .val{font-family:var(--font-head);font-weight:800;font-size:22px;line-height:1;min-width:64px}
.rec li:first-child .val{color:var(--gold)}
.rec.plain li:first-child .val{color:inherit}
.rec li .txt{min-width:0;overflow-wrap:anywhere;font-size:14px;line-height:1.3}
.rec li .txt small{display:block;color:var(--muted);font-size:13px}

/* matrix */
.mx td.c{text-align:center;min-width:50px;color:var(--ink)}
.mx td.self{background:var(--raised)}
.mx th.v{writing-mode:vertical-rl;transform:rotate(180deg);text-align:left;height:96px;vertical-align:bottom;letter-spacing:.04em;text-transform:none;font-size:13px}

/* controls */
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{min-height:40px;min-width:60px;border:1px solid var(--line2);background:var(--surface);border-radius:3px;padding:0 14px;cursor:pointer;
  font-family:var(--font-head);font-weight:700;font-size:15px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--maroon);border-color:var(--maroon);color:#fff}
.picker{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
select{min-height:42px;font-family:var(--font-head);font-weight:600;font-size:16px;padding:0 10px;border-radius:3px;border:1px solid var(--line2);background:var(--surface);color:var(--ink);max-width:100%}

.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:14px}
.bars{display:grid;gap:8px}
.bar{display:grid;grid-template-columns:minmax(0,1fr) 70px;gap:4px 10px;align-items:center;font-size:14px}
.bar .lbl{overflow-wrap:anywhere}
.bar .lbl span{color:var(--muted)}
.bar .val{font-family:var(--font-head);font-weight:800;font-size:17px;text-align:right}
.bar .track{grid-column:1/-1;height:8px;border-radius:2px;background:var(--raised);overflow:hidden}
.bar .track i{display:block;height:100%;background:var(--maroon-hi)}
.bar.top .track i{background:var(--gold)}
.bar.me .lbl{font-weight:700;color:var(--gold)}

.career{display:grid;grid-template-columns:repeat(auto-fit,minmax(125px,1fr));background:var(--surface);border:1px solid var(--line);border-radius:4px;overflow:hidden}
.stat{padding:10px 12px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);margin:0 -1px -1px 0}
.stat .k{font-family:var(--font-head);font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.stat .v{font-family:var(--font-head);font-weight:800;font-size:26px;line-height:1.1}

.bracket{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:12px}
.round{display:grid;gap:8px;align-content:start}
.round h3{font-family:var(--font-head);font-weight:700;font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.round .game{padding-top:8px}

/* owner profile header */
.profile{display:flex;align-items:center;gap:14px;padding-bottom:4px}
.profile .av{width:52px;height:52px;font-size:18px}
.profile h2{font-family:var(--font-head);font-weight:800;font-size:32px;line-height:1;letter-spacing:.02em;text-transform:uppercase}
.profile p{margin:4px 0 0;color:var(--muted);font-size:14px}

/* your team */
.mine{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:4px;padding:14px 16px;display:grid;gap:12px}
.mine h2{font-family:var(--font-head);font-weight:800;font-size:24px;line-height:1;letter-spacing:.02em;text-transform:uppercase;display:flex;align-items:center;gap:10px}
.mine h2 .av{width:34px;height:34px;font-size:12px}
.mine-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:10px 18px}
.mine-grid div{display:grid;gap:1px;min-width:0}
.mine-grid .k{font-family:var(--font-head);font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.mine-grid .v{font-family:var(--font-head);font-weight:700;font-size:18px;overflow-wrap:anywhere}
.mine-grid small{color:var(--muted);font-size:13px}
.hint{color:var(--muted);font-size:14px;margin:0;padding:10px 14px;background:var(--surface);border:1px dashed var(--line2);border-radius:4px}
.jump{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding-inline:16px;border-bottom:1px solid var(--line)}
.jump::-webkit-scrollbar{display:none}
.jump button{flex:0 0 auto;min-height:40px;border:0;background:none;padding:0 10px;cursor:pointer;font-family:var(--font-head);font-weight:700;font-size:14px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);box-shadow:inset 0 -2px 0 transparent}
.jump button:hover{color:var(--ink);box-shadow:inset 0 -2px 0 var(--line2)}
.more{justify-self:start;min-height:36px;border:1px solid var(--line2);background:var(--surface);border-radius:3px;padding:0 12px;cursor:pointer;font-family:var(--font-head);font-weight:700;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.more-btn{display:none}
@media (max-width:640px){ .tbl-wrap:not(.full) .adv{display:none} .more-btn{display:inline-flex;align-items:center} }

/* weekly bet */
.picks{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));background:var(--surface);border:1px solid var(--line);border-radius:4px;overflow:hidden}
.pk{padding:10px 12px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);margin:0 -1px -1px 0;display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;min-width:0}
.pk .who{font-family:var(--font-head);font-weight:700;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.pk .what{font-weight:600;overflow-wrap:anywhere;min-width:0}
.pk .tags{grid-column:2;grid-row:1/span 2;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.pk.none .what{color:var(--muted);font-weight:500;font-style:italic}
.status{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:10px 14px;border-radius:4px;border:1px solid var(--line);background:var(--raised)}
.status b{font-family:var(--font-head);font-size:20px;font-weight:800;text-transform:uppercase;letter-spacing:.02em}
.grid td.p{white-space:normal;min-width:118px;max-width:150px;text-align:left;font-family:var(--font-body);font-size:13px;line-height:1.3;vertical-align:top}
.grid td.p.hit{background:rgba(76,195,138,.2)}
.grid td.p.miss{background:rgba(240,97,106,.18)}
.grid td.p.push{background:rgba(155,167,182,.16)}
.grid td.p.none{color:var(--dim)}
details.how{border-top:1px solid var(--line);padding-top:12px;color:var(--muted);font-size:13.5px}
details.how summary{cursor:pointer;font-weight:600;color:var(--ink);min-height:32px;font-family:var(--font-head);font-size:15px;letter-spacing:.04em;text-transform:uppercase}
details.how ul{margin:8px 0 0;padding-left:18px;display:grid;gap:4px;max-width:75ch}
footer{margin-top:40px;padding-top:14px;border-top:1px solid var(--line);color:var(--muted);font-size:13px}
.tabs,.jump{-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 28px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 28px),transparent)}
@media (min-width:900px){.tabs,.jump{-webkit-mask-image:none;mask-image:none}}
select.unset{border-color:var(--gold)}
@media (max-width:560px){
  td.team{min-width:150px}
  th,td{padding:8px 7px}
  .tab{padding:0 11px;font-size:15px}
  .awards{grid-template-columns:1fr 1fr}
  .awards>.award:last-child:nth-child(odd){grid-column:1/-1}
  .award{grid-template-columns:1fr;padding:10px 12px}
  .award .v{font-size:28px}
  .brand .wrap{min-height:54px;gap:10px}
  .lockup svg{width:28px;height:28px}
  .lockup .mark{font-size:17px}
  .lockup .mark small{font-size:10px;margin-top:3px}
  .me-pick select{max-width:136px;font-size:14px}
  .side .sc{font-size:23px}
  .tk-lbl{padding:8px 10px;font-size:13px}
  .block h2{font-size:23px}
}
@media (prefers-reduced-motion:no-preference){.view{animation:fade .2s ease-out}@keyframes fade{from{opacity:.5}to{opacity:1}}}
</style>
</head>
<body>
<header class="brand">
  <div class="wrap">
    <a class="lockup" href="/" aria-label="Cork n' Pork Hall of Fame, home">
      <svg viewBox="0 0 64 64" aria-hidden="true"><path d="M20 14h24v8a12 12 0 0 1-24 0z" fill="#DDB862"/><path d="M20 18h-6a6 6 0 0 0 6 8M44 18h6a6 6 0 0 1-6 8" stroke="#DDB862" stroke-width="3" fill="none"/><rect x="29" y="33" width="6" height="9" fill="#DDB862"/><rect x="21" y="42" width="22" height="7" rx="2" fill="#DDB862"/></svg>
      <span class="mark">Cork n' Pork<small id="mast-eyebrow">Hall of Fame</small></span>
    </a>
    <label class="me-pick"><span class="sr">Highlight my team</span>
      <select id="me" aria-label="Highlight my team"><option value="">My team</option></select>
    </label>
  </div>
</header>

<nav class="tabs" role="tablist" aria-label="Sections">
  <div class="tabs-inner">
    <button class="tab" role="tab" data-tab="week" id="tab-week" aria-controls="p-week">This Week</button>
    <button class="tab" role="tab" data-tab="bets" id="tab-bets" aria-controls="p-bets">Weekly Bet</button>
    <button class="tab" role="tab" data-tab="trophies" id="tab-trophies" aria-controls="p-trophies">Trophy Room</button>
    <button class="tab" role="tab" data-tab="records" id="tab-records" aria-controls="p-records">Record Book</button>
    <button class="tab" role="tab" data-tab="rivalries" id="tab-rivalries" aria-controls="p-rivalries">Rivalries</button>
    <button class="tab" role="tab" data-tab="drafts" id="tab-drafts" aria-controls="p-drafts">Drafts</button>
    <button class="tab" role="tab" data-tab="owners" id="tab-owners" aria-controls="p-owners">Owners</button>
  </div>
</nav>

<div class="ticker" id="ticker" hidden></div>

<div class="wrap">
  <main>
    <section class="view" id="p-week" role="tabpanel" aria-labelledby="tab-week"></section>
    <section class="view" id="p-bets" role="tabpanel" aria-labelledby="tab-bets" hidden></section>
    <section class="view" id="p-trophies" role="tabpanel" aria-labelledby="tab-trophies" hidden></section>
    <section class="view" id="p-records" role="tabpanel" aria-labelledby="tab-records" hidden></section>
    <section class="view" id="p-rivalries" role="tabpanel" aria-labelledby="tab-rivalries" hidden></section>
    <section class="view" id="p-drafts" role="tabpanel" aria-labelledby="tab-drafts" hidden></section>
    <section class="view" id="p-owners" role="tabpanel" aria-labelledby="tab-owners" hidden></section>
  </main>

  <footer id="foot"></footer>
</div>

<script type="application/json" id="data">__DATA__</script>
<script>
(function(){
const R = JSON.parse(document.getElementById('data').textContent);
const C = R.cur, T = C.teams, OWN = R.owners;
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const f1 = x => Number(x).toFixed(1), f2 = x => Number(x).toFixed(2);
const sgn = x => (x > 0 ? '+' : x < 0 ? '−' : '') + f1(Math.abs(x));
const pct = x => x.toFixed(3).replace(/^0/, '');
const ord = n => n + (['th','st','nd','rd'][(n % 100 - 20) % 10] || ['th','st','nd','rd'][n % 100] || 'th');
const first = n => n.split(' ')[0];
const tm = id => T[String(id)];

/* ---- team identity: ESPN logo when the data carries one, otherwise a monogram in a hue derived from the team name ---- */
const hue = s => { let h = 7; for (const c of String(s)) h = (h * 31 + c.charCodeAt(0)) >>> 0; return h % 360; };
const mono = name => { const w = String(name).replace(/[^A-Za-z0-9 ]/g, ' ').split(/\s+/).filter(x => x && !/^(the|team|of|and)$/i.test(x)); return ((w[0] || name)[0] + (w[1] ? w[1][0] : (w[0] || name)[1] || '')).toUpperCase(); };
const idByTeam = {}; Object.entries(T).forEach(([id, t]) => { idByTeam[t.team] = +id; });
const av = (name, id) => {
  const t = id != null ? tm(id) : (idByTeam[name] != null ? tm(idByTeam[name]) : null);
  const logo = t && t.logo ? `<img src="${esc(t.logo)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">` : '';
  return `<span class="av" style="--c:hsl(${hue(name)} 42% 40%)" aria-hidden="true">${esc(mono(name))}${logo}</span>`;
};
const abbr = (name, id) => {
  const t = id != null ? tm(id) : null;
  if (t && t.ab) return String(t.ab).toUpperCase();
  const w = String(name).replace(/[^A-Za-z0-9 ]/g, ' ').split(/\s+/).filter(x => x && !/^(the|of|and)$/i.test(x));
  return (w.length >= 2 ? w.slice(0, 4).map(x => x[0]).join('') : (w[0] || name).slice(0, 4)).toUpperCase();
};
const tcell = (team, owner, id) => `<td class="team"><span class="tc">${av(team, id)}<span><b>${esc(team)}</b><span>${esc(owner)}</span></span></span></td>`;
const LW = R.doneWeeks, NW = R.previewWeek, YR = R.current;
const asOf = new Date(R.asOf + 'T12:00:00');
const asOfTxt = asOf.toLocaleDateString('en-US', {weekday:'short', month:'short', day:'numeric'});
const blk = (title, note, body, extra='', id='') => `<div class="block"${id ? ` id="${id}"` : ''}><div class="block-head"><h2>${title}</h2>${extra}</div>${note ? `<p class="note">${note}</p>` : ''}${body}</div>`;

/* ---- "highlight my team" (saved on this device only) ---- */
const store = { get(){ try { return localStorage.getItem('cnp-me') || ''; } catch(e) { return ''; } },
                set(v){ try { localStorage.setItem('cnp-me', v); } catch(e) {} } };
let ME = store.get();
try { const q = new URLSearchParams(location.search).get('me'); if (q) { const hit = OWN.find(n => n.toLowerCase().startsWith(q.toLowerCase())); if (hit) { ME = hit; store.set(ME); } } } catch (e) {}
if (ME && !OWN.includes(ME)) ME = '';
const meSel = document.getElementById('me');
[...OWN].sort().forEach(n => meSel.insertAdjacentHTML('beforeend', `<option value="${esc(n)}">${esc(n)}</option>`));
meSel.value = ME;
meSel.classList.toggle('unset', !ME);
function markMe(){
  document.querySelectorAll('[data-o]').forEach(el => el.classList.toggle('me', !!ME && (el.dataset.o === ME || el.dataset.o2 === ME)));
}
meSel.addEventListener('change', () => { ME = meSel.value; store.set(ME); meSel.classList.toggle('unset', !ME); if (rendered.week) renderWeek(); markMe(); });
const dO = name => `data-o="${esc(name)}"`;

/* ---- brand bar, scoreboard ticker, footer ---- */
const done = R.seasons.filter(s => s.done);
const distinct = new Set(done.map(s => s.champ.owner)).size;
document.getElementById('mast-eyebrow').textContent = `Hall of Fame, est. ${R.seasons[0].year}`;
const status = C.seasonDone ? `The ${YR} season is complete.`
  : LW === 0 ? `The ${YR} season kicks off soon.`
  : LW >= R.regWeeks ? `The ${YR} regular season is done and the playoffs are on.`
  : `Week ${LW} is final${NW ? ` and Week ${NW} is on deck` : ''}.`;
document.getElementById('foot').innerHTML =
  `${done.length} seasons, ${distinct} different champions, ${OWN.length} owners since ${R.seasons[0].year}. Built from the league's ESPN data; the site refreshes every Tuesday morning after Monday Night Football and again Thursday afternoon before kickoff. Last update: ${esc(asOf.toLocaleDateString('en-US', {month:'long', day:'numeric', year:'numeric'}))}.`;

// The strip under the nav: this week's live scores while games are on, otherwise the last completed week's results.
const LIVE = C.clench && C.clench.live && C.clench.live.games.length ? C.clench.live : null;
function renderTicker(){
  const el = document.getElementById('ticker');
  const row = (id, p, win) => `<span class="r ${win ? 'w' : ''}">${av(tm(id).team, id)}<span class="nm">${esc(abbr(tm(id).team, id))}</span><span class="pt num">${f1(p)}</span></span>`;
  let label = '', items = [];
  if (LIVE) {
    const when = new Date(LIVE.asOf).toLocaleString('en-US', { weekday: 'short', hour: 'numeric', minute: '2-digit', timeZone: 'America/New_York' });
    label = `<div class="tk-lbl"><span>Week ${LIVE.wk}</span><small>Live ${esc(when)} ET</small></div>`;
    items = LIVE.games.map(g => `<button type="button" class="tk" data-go="wk-clench" ${dO(tm(g.h).owner)} data-o2="${esc(tm(g.a).owner)}">
      <span class="st ${g.status === 'final' ? '' : 'live'}">${g.status === 'final' ? 'Final' : g.status === 'clencher' ? '<i class="dot"></i>Coin flip' : g.status === 'locked' ? 'Locked up' : '<i class="dot"></i>Live'}</span>
      ${row(g.h, g.hp, g.hp >= g.ap)}${row(g.a, g.ap, g.ap > g.hp)}</button>`);
  } else if (C.recap && C.recap.length) {
    label = `<div class="tk-lbl"><span>Week ${LW}</span><small>Final</small></div>`;
    items = C.recap.map(m => `<button type="button" class="tk" data-go="wk-results" ${dO(tm(m.h).owner)} data-o2="${esc(tm(m.a).owner)}">
      <span class="st">Final</span>${row(m.h, m.hp, m.win === 'H')}${row(m.a, m.ap, m.win === 'A')}</button>`);
    // then next week's matchups with ESPN's projections
    items.push(...C.preview.map(m => `<button type="button" class="tk" data-go="wk-preview" ${dO(tm(m.h).owner)} data-o2="${esc(tm(m.a).owner)}">
      <span class="st">Wk ${NW} proj</span>${row(m.h, m.hProj, m.hProj >= m.aProj)}${row(m.a, m.aProj, m.aProj > m.hProj)}</button>`));
  }
  if (!items.length) { el.hidden = true; return; }
  el.hidden = false;
  el.innerHTML = `<div class="ticker-in">${label}${items.join('')}</div>`;
  el.querySelectorAll('[data-go]').forEach(b => b.addEventListener('click', () => { show('week'); jumpTo(b.dataset.go); }));
}
function jumpTo(id){
  const t = document.getElementById(id); if (!t) return;
  const tb = document.querySelector('.tabs');
  const y = t.getBoundingClientRect().top + window.scrollY - tb.offsetHeight - 12;
  window.scrollTo({ top: y, behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' });
}

/* ================= THIS WEEK ================= */
function renderWeek(){
  const el = document.getElementById('p-week');
  const parts = [];
  if (C.seasonDone) {
    const s = R.seasons.find(s => s.year === YR);
    parts.push(`<div class="banner"><b>${esc(s.champ.team)}</b> (${esc(s.champ.owner)}) won the ${YR} title. See the Trophy Room for the full season.</div>`);
  }
  if (!C.standings.length) {
    parts.push(blk(`${YR} season`, '', `<p class="note">No games have been played yet. Standings, awards and the weekly breakdown start showing up after Week 1.</p>`));
    el.innerHTML = parts.join(''); return;
  }
  const A = C.awards, S = C.standings;
  const lowGame = C.recap.find(m => m.h === A.low.tm || m.a === A.low.tm);
  const lowBench = lowGame ? (lowGame.h === A.low.tm ? lowGame.hBench : lowGame.aBench) : 0;
  const tName = id => `<b>${esc(tm(id).team)}</b><small>${esc(tm(id).owner)}</small>`;
  const tile = (k, v, d, ownerId, hot) => `<div class="award ${hot ? 'hot' : ''}" ${ownerId != null ? dO(tm(ownerId).owner) : ''}><div class="k">${k}</div><div class="v num">${v}</div><div class="d">${d}</div></div>`;
  const tiles = [
    tile('High score', f1(A.high.v), tName(A.high.tm), A.high.tm, true),
    tile('Low score', f1(A.low.v), `<b>${esc(tm(A.low.tm).team)}</b><small>${esc(tm(A.low.tm).owner)}${lowBench > 0.05 ? `, left ${f1(lowBench)} on the bench` : ''}</small>`, A.low.tm),
    tile('Blowout', '+' + f1(A.blowout.wp - A.blowout.lp), `<b>${esc(tm(A.blowout.w).team)}</b><small>beat ${esc(tm(A.blowout.l).team)}, ${f2(A.blowout.wp)} to ${f2(A.blowout.lp)}</small>`, A.blowout.w),
    tile('Ass-clencher', '+' + f2(A.close.wp - A.close.lp), `<b>${esc(tm(A.close.w).team)}</b><small>beat ${esc(tm(A.close.l).team)}, ${f2(A.close.wp)} to ${f2(A.close.lp)}</small>`, A.close.w),
    tile('Top player', f1(A.mvp.v), `<b>${esc(A.mvp.player)}</b><small>${esc(tm(A.mvp.tm).team)}</small>`, A.mvp.tm),
    tile('Bench regret', f1(A.bench.v), `<b>${esc(tm(A.bench.tm).team)}</b><small>Left ${f1(A.bench.v)} on the bench, including ${esc(A.bench.player)} (${f1(A.bench.pv)})</small>`, A.bench.tm),
    tile('Best lineup call', f1(A.manager.eff) + '%', `<b>${esc(tm(A.manager.tm).team)}</b><small>${A.manager.perfect ? 'Started the best possible lineup' : 'of the best possible score'}${A.manager.res === 'L' ? ', and still lost' : A.manager.res === 'W' ? ' and won' : ''}</small>`, A.manager.tm),
    tile('Beat projection', sgn(A.beatProj.v), `<b>${esc(tm(A.beatProj.tm).team)}</b><small>Scored ${f1(A.beatProj.a)}, projected ${f1(A.beatProj.p)}</small>`, A.beatProj.tm),
    tile('Missed projection', sgn(A.missProj.v), `<b>${esc(tm(A.missProj.tm).team)}</b><small>Scored ${f1(A.missProj.a)}, projected ${f1(A.missProj.p)}</small>`, A.missProj.tm),
  ].join('');

  const side = (id, pts, win) => `<div class="side ${win ? '' : 'lose'}">${av(tm(id).team, id)}<span class="tn">${esc(tm(id).team)}${win ? ' <span class="chip w wl" aria-hidden="true">W</span><span class="sr"> (won)</span>' : ''}</span><span class="on">${esc(tm(id).owner)}</span><span class="sc num">${f2(pts)}</span></div>`;
  const recap = C.recap.map(m => `<article class="game" ${dO(tm(m.h).owner)} data-o2="${esc(tm(m.a).owner)}">
      <div class="gh"><span>Final</span><span>Margin ${f1(Math.abs(m.hp - m.ap))}</span></div>
      ${side(m.h, m.hp, m.win === 'H')}${side(m.a, m.ap, m.win === 'A')}
      <div class="meta"><span>Top scorers: ${esc(m.hTop[0])} ${f1(m.hTop[1])}, ${esc(m.aTop[0])} ${f1(m.aTop[1])}</span>
      <span>Points left on bench: ${f1(m.hBench)} and ${f1(m.aBench)}</span></div></article>`).join('');

  const series = m => {
    const [w, l] = m.h2h, ho = first(tm(m.h).owner), ao = first(tm(m.a).owner);
    if (w + l === 0) return 'First meeting';
    if (w === l) return `Series tied ${w}-${l}`;
    return w > l ? `${esc(ho)} leads the series ${w}-${l}` : `${esc(ao)} leads the series ${l}-${w}`;
  };
  const preview = C.preview.map(m => {
    const tot = m.hProj + m.aProj, hs = tot ? m.hProj / tot * 100 : 50;
    const fav = m.hProj >= m.aProj ? m.h : m.a, edge = Math.abs(m.hProj - m.aProj);
    const alerts = [[m.h, m.hProj], [m.a, m.aProj]].filter(([, p]) => p < 85)
      .map(([id, p]) => `<span class="alert">Lineup check: ${esc(tm(id).team)} projects only ${f1(p)}. Look for empty or bye-week slots.</span>`).join('');
    const pside = (id, proj, ppg) => `<div class="side">${av(tm(id).team, id)}<span class="tn">${esc(tm(id).team)}</span><span class="on">${esc(tm(id).owner)} (${tm(id).w}-${tm(id).l}), ${f1(ppg)} avg</span><span class="sc num">${f1(proj)}</span></div>`;
    return `<article class="game pv" ${dO(tm(m.h).owner)} data-o2="${esc(tm(m.a).owner)}">
      <div class="gh"><span>Week ${NW}</span><span>Projected</span></div>
      ${pside(m.h, m.hProj, m.hPpg)}${pside(m.a, m.aProj, m.aPpg)}
      <div class="split" role="img" aria-label="Share of projected points"><i style="width:${hs.toFixed(1)}%"></i><i style="width:${(100 - hs).toFixed(1)}%"></i></div>
      <div class="meta"><span>${edge < 3 ? 'Toss-up on projections' : `${esc(tm(fav).team)} favored by ${f1(edge)}`}. ${series(m)}</span>
      <span>Top projected starters: ${esc(m.hTop[0])} ${f1(m.hTop[1])}, ${esc(m.aTop[0])} ${f1(m.aTop[1])}</span>${alerts}</div></article>`;
  }).join('');

  const move = r => { const d = r.prPrev - r.pr; return d > 0 ? `<span class="up" aria-label="up ${d}">▲${d}</span>` : d < 0 ? `<span class="down" aria-label="down ${-d}">▼${-d}</span>` : `<span class="flat" aria-label="no change">–</span>`; };
  const pr = [...S].sort((a, b) => a.pr - b.pr);
  const prHtml = `<div class="tbl-wrap"><table class="sticky1"><caption class="sr">Power rankings</caption><thead><tr><th class="l" scope="col">Team</th><th scope="col">Rank</th><th scope="col">Move</th><th scope="col">Power</th><th scope="col" class="adv">Avg</th><th scope="col" class="adv">Last 3</th><th scope="col" class="adv">All-play</th><th scope="col">Record</th></tr></thead><tbody>${
    pr.map(r => `<tr ${dO(r.owner)}>${tcell(r.team, r.owner, r.tm)}<td><span class="rk ${r.pr === 1 ? 'top' : ''}">${r.pr}</span></td><td>${move(r)}</td><td><b>${f1(r.power)}</b></td><td class="adv">${f1(r.ppg)}</td><td class="adv">${f1(r.l3)}</td><td class="adv">${r.apw}-${r.apl}</td><td>${r.w}-${r.l}</td></tr>`).join('')
  }</tbody></table></div>`;

  const cut = R.poTeams;
  const moreBtn = `<button type="button" class="more more-btn" aria-expanded="false">Show all stats</button>`;
  const stHtml = `<div class="tbl-wrap" id="st-wrap"><table class="sticky1"><caption class="sr">Standings</caption><thead><tr><th class="l" scope="col">Team</th><th scope="col">Seed</th><th scope="col">W-L</th><th scope="col">PF</th><th scope="col" class="adv">PA</th><th scope="col" class="adv">All-play</th><th scope="col" class="adv">Luck</th><th scope="col">Streak</th><th scope="col" class="adv">Bench pts</th><th scope="col" class="adv">Lineup %</th><th scope="col" class="adv">Schedule left</th></tr></thead><tbody>${
    S.map(r => `<tr class="${r.seed === cut ? 'cut' : ''}" ${dO(r.owner)}>${tcell(r.team, r.owner, r.tm)}<td><span class="rk ${r.seed === 1 ? 'top' : ''}">${r.seed}</span></td><td><b>${r.w}-${r.l}${r.tie ? '-' + r.tie : ''}</b></td><td>${f1(r.pf)}</td><td class="adv">${f1(r.pa)}</td><td class="adv">${r.apw}-${r.apl}</td><td class="adv ${r.luck > 0.4 ? 'pos' : r.luck < -0.4 ? 'neg' : ''}">${sgn(r.luck)}</td><td><span class="chip ${r.streak[0] === 'W' ? 'w' : 'l'}">${r.streak}</span></td><td class="adv">${f1(r.bench)}</td><td class="adv">${f1(r.eff)}</td><td class="adv">${r.sosRank ? `${ord(r.sosRank)} hardest` : '–'}</td></tr>`).join('')
  }</tbody></table></div>`;

  const all = S.flatMap(r => r.scores), mn = Math.min(...all), mx = Math.max(...all);
  const heatHtml = `<div class="tbl-wrap"><table class="heat sticky1"><caption class="sr">Scores by week</caption><thead><tr><th class="l" scope="col">Team</th>${S[0].scores.map((_, i) => `<th scope="col">Wk ${i + 1}</th>`).join('')}<th scope="col">Total</th></tr></thead><tbody>${
    [...S].sort((a, b) => b.pf - a.pf).map(r => `<tr ${dO(r.owner)}>${tcell(r.team, r.owner, r.tm)}${r.scores.map((s, i) => {
      const mix = Math.round(3 + (mx > mn ? (s - mn) / (mx - mn) : .5) * 57);
      return `<td class="c" style="background:color-mix(in srgb,var(--maroon-hi) ${mix}%,var(--surface))">${f1(s)}<small>${r.res[i]} ${ord(r.wkRank[i])}</small></td>`;
    }).join('')}<td><b>${f1(r.pf)}</b></td></tr>`).join('')
  }</tbody></table></div>`;

  const mvps = C.weekMvps.map(w => `<li ${dO(tm(w.tm).owner)}><span class="val num">${f1(w.v)}</span><span class="txt">Week ${w.wk}: ${esc(w.player)}<small>${esc(tm(w.tm).team)}. Top team score: ${f1(w.hi)} by ${esc(tm(w.hiTm).team)}</small></span></li>`).join('');

  const inPlayoffs = C.bracket && C.bracket.length && LW >= R.regWeeks && !C.seasonDone;
  parts.push(hero(), myWeek());
  const clench = clenchBlock(), clenchLive = !!LIVE;
  const jumps = [...(clenchLive ? [['wk-clench', 'Ass Clenchers']] : []), ['wk-results', `Week ${LW} results`], ...(clench && !clenchLive ? [['wk-clench', 'Ass Clenchers']] : []),
    ...(C.preview.length ? [['wk-preview', `Week ${NW} preview`]] : []), ['wk-power', 'Power rankings'], ['wk-standings', 'Standings'], ['wk-heat', 'Scores by week']];
  parts.push(`<nav class="jump" aria-label="On this page">${jumps.map(([id, l]) => `<button type="button" data-jump="${id}">${l}</button>`).join('')}</nav>`);
  if (inPlayoffs) parts.push(bracketBlock());
  if (clenchLive) parts.push(clench);
  parts.push(
    blk(`Week ${LW} awards`, '', `<div class="awards">${tiles}</div>`),
    blk(`Week ${LW} results`, 'Biggest margin first.', `<div class="games">${recap}</div>`, '', 'wk-results')
  );
  if (clench && !clenchLive) parts.push(clench);
  if (preview) parts.push(blk(`Week ${NW} preview`, `ESPN projections for each starting lineup as of ${asOfTxt}. Lineups can still change before kickoff.`, `<div class="games">${preview}</div>`, '', 'wk-preview'));
  if (C.bracket && C.bracket.length && !inPlayoffs) parts.push(bracketBlock());
  parts.push(
    blk('Power rankings', 'Blends season scoring average (60%), the last three weeks (25%) and all-play win rate (15%). Movement compares with last week.', prHtml + moreBtn, '', 'wk-power'),
    blk('Standings', `The top ${cut} make the playoffs; the line under the last seed marks the cut. "Schedule left" ranks how strong each team's remaining opponents have scored.`, stHtml + moreBtn, '', 'wk-standings'),
    blk('Scores by week', 'Redder cells are bigger weeks. Each cell shows the result and where the score ranked that week.', heatHtml, '', 'wk-heat'),
    blk('Best player each week', '', `<div class="rec plain"><ol>${mvps}</ol></div>`),
    `<details class="how"><summary>How these numbers work</summary><ul>
      <li>All-play record is how a team would stand if it played every other team every week.</li>
      <li>Luck is actual wins minus the wins that all-play record would predict.</li>
      <li>Bench points and lineup % compare each lineup with the best one possible from the same roster (QB, 2 RB, 2 WR, TE, FLEX, D/ST, K).</li>
      <li>Records count regular-season and championship-bracket games. Consolation games are left out.</li></ul></details>`
  );
  el.innerHTML = parts.join('');
  el.querySelectorAll('[data-jump]').forEach(b => b.addEventListener('click', () => jumpTo(b.dataset.jump)));
  el.querySelectorAll('.more-btn').forEach(mb => mb.addEventListener('click', () => {
    const w = mb.previousElementSibling, on = w.classList.toggle('full');
    mb.setAttribute('aria-expanded', String(on)); mb.textContent = on ? 'Show fewer stats' : 'Show all stats';
  }));
  markMe();
}

/* ================= ASS CLENCHERS ================= */
// The close games, written up: a live board while the week is being played, then the recap and the season ledger.
function clenchBlock(){
  const K = C.clench;
  if (!K) return '';
  const L = K.live, live = L && L.games.length;
  const chipFor = st => st === 'clencher' ? '<span class="chip hot">Ass-clencher watch</span>' : st === 'live' ? '<span class="chip">Still live</span>'
    : st === 'locked' ? '<span class="chip">Locked up</span>' : '<span class="chip w">Final</span>';
  const scoreSide = (id, p, lead, fin) => `<div class="side ${lead ? '' : 'lose'}">${av(tm(id).team, id)}<span class="tn">${esc(tm(id).team)}</span><span class="on">${esc(tm(id).owner)}${fin != null && Math.abs(fin - p) > 0.05 ? `, projects to ${f1(fin)}` : ''}</span><span class="sc num">${f1(p)}</span></div>`;
  const leftTxt = (id, left) => left.length
    ? `<span><b>${esc(first(tm(id).owner))}</b> still to play: ${left.map(p => `${esc(p.name)} <span class="num">${f1(p.proj)}</span>${p.state === 'in' ? ' (in progress)' : ''}`).join(', ')}</span>`
    : `<span><b>${esc(first(tm(id).owner))}</b>: nobody left</span>`;
  const parts = [];
  if (live) {
    const when = new Date(L.asOf).toLocaleString('en-US', { weekday: 'short', hour: 'numeric', minute: '2-digit', timeZone: 'America/New_York' });
    const next = L.next.filter(n => n.state !== 'post');
    const nextTxt = next.length ? ` ${next.map(n => `${esc(n.game)}${n.state === 'in' ? ' is on now' : ` kicks off ${esc(n.when)}`}`).join('; ')}.` : ' Every game is final; the week closes once ESPN locks the scores.';
    const nHot = L.games.filter(g => g.status === 'clencher').length;
    parts.push(`<p class="note">Week ${L.wk} live board as of ${when} ET.${nextTxt}${nHot ? ` ${nHot === 1 ? 'One matchup is' : nHot + ' matchups are'} still a coin flip.` : ''}</p>`);
    parts.push(`<div class="stories">${L.games.map(g => {
      const hl = g.hp >= g.ap;
      return `<article class="story ${g.status === 'clencher' ? 'hot' : ''}" ${dO(tm(g.h).owner)} data-o2="${esc(tm(g.a).owner)}">
        <div class="tag">${chipFor(g.status)}<span>Margin ${f1(g.margin)}</span></div>
        ${scoreSide(g.h, g.hp, hl, g.status === 'final' ? null : g.hFinal)}${scoreSide(g.a, g.ap, !hl, g.status === 'final' ? null : g.aFinal)}
        <h3>${esc(g.head)}</h3><p>${esc(g.story)}</p>
        ${g.status === 'final' ? '' : `<div class="left">${leftTxt(g.h, g.hLeft)}${leftTxt(g.a, g.aLeft)}</div>`}
      </article>`;
    }).join('')}</div>`);
  }
  if (K.recap && K.recap.games.length) {
    parts.push(`<h3 class="sub">Week ${K.recap.wk} in review</h3>`);
    parts.push(`<div class="stories">${K.recap.games.map((g, i) => `<article class="story ${i === 0 ? 'hot' : ''}" ${dO(tm(g.w).owner)} data-o2="${esc(tm(g.l).owner)}">
        <div class="tag">${i === 0 ? '<span class="chip hot">Ass-clencher</span>' : '<span class="chip">Close call</span>'}<span>Margin ${f1(g.margin)}</span></div>
        ${scoreSide(g.w, g.wp, true, null)}${scoreSide(g.l, g.lp, false, null)}
        <h3>${esc(g.head)}</h3><p>${esc(g.story)}</p></article>`).join('')}</div>`);
  }
  if (K.ledger.length) {
    const tightest = Math.min(...K.ledger.map(r => r.margin));
    parts.push(`<h3 class="sub">Clencher of the week, all season</h3>`);
    parts.push(`<p class="note">${K.tight} of ${K.games} games this season have been decided by fewer than 10 points. The tightest is marked.</p>`);
    parts.push(`<div class="tbl-wrap"><table class="ledger sticky1"><caption class="sr">Closest game each week</caption><thead><tr><th class="l" scope="col">Week</th><th class="l" scope="col">Winner</th><th class="l" scope="col">Over</th><th scope="col">Score</th><th scope="col">Margin</th></tr></thead><tbody>${
      K.ledger.map(r => `<tr ${dO(tm(r.w).owner)} data-o2="${esc(tm(r.l).owner)}"><td class="l">Wk ${r.wk}</td>${tcell(tm(r.w).team, tm(r.w).owner, r.w)}${tcell(tm(r.l).team, tm(r.l).owner, r.l)}<td>${f2(r.wp)}–${f2(r.lp)}</td><td class="${r.margin === tightest ? 'tight' : ''}">${f2(r.margin)}</td></tr>`).join('')
    }</tbody></table></div>`);
  }
  if (!parts.length) return '';
  const note = live ? '' : `The closest finishes of Week ${LW}, written up, plus the tightest game of every week this season.`;
  return blk('Ass Clenchers', note, parts.join(''), '', 'wk-clench');
}

/* the big week headline at the top of This Week */
function hero(){
  const wk = LIVE ? LIVE.wk : LW;
  const when = LIVE ? new Date(LIVE.asOf).toLocaleString('en-US', { weekday: 'short', hour: 'numeric', minute: '2-digit', timeZone: 'America/New_York' }) : '';
  const head = C.seasonDone ? `${YR} is in the books`
    : LIVE ? `<span class="live-tag"><i class="dot"></i>Live</span> as of ${esc(when)} ET`
    : LW >= R.regWeeks ? 'Playoffs' : 'Final';
  const sub = C.seasonDone ? `Every result, record and rivalry since ${R.seasons[0].year} is in the tabs above.`
    : LIVE ? `Week ${LW} is final. Scores below update with every refresh; ESPN locks the week after Monday night.`
    : `${status} ESPN data as of ${asOfTxt}.`;
  return `<div class="hero"><div class="hero-wk"><div class="big">Week <span>${wk}</span></div></div><div class="hero-txt"><b>${head}</b><p>${sub}</p></div></div>`;
}

/* the "your week" card for whoever is picked in Highlight my team */
function myWeek(){
  const entry = Object.entries(T).find(([, t]) => t.owner === ME);
  if (!entry) return `<p class="hint">Pick your name in the "My team" menu at the top for your own summary here and your rows marked on every page.</p>`;
  const id = +entry[0], t = entry[1], st = C.standings.find(r => r.tm === id);
  const g = C.recap.find(m => m.h === id || m.a === id);
  let last = '';
  if (g) {
    const home = g.h === id, mine = home ? g.hp : g.ap, theirs = home ? g.ap : g.hp, opp = home ? g.a : g.h;
    const won = (g.win === 'H') === home;
    last = `<div><span class="k">Week ${LW}</span><span class="v">${won ? 'Won' : 'Lost'} ${f2(mine)} to ${f2(theirs)}</span><small>vs ${esc(tm(opp).team)}, ${(() => { const r = st.wkRank.at(-1), n = C.standings.length; return r === 1 ? 'top score of the week' : r === n ? 'lowest score of the week' : `${ord(r)}-best score of the week`; })()}</small></div>`;
  }
  const d = st.prPrev - st.pr;
  const rank = `<div><span class="k">Standing</span><span class="v">${st.w}-${st.l}, ${ord(st.seed)} seed</span><small>Power rank ${st.pr}${d > 0 ? ` (up ${d})` : d < 0 ? ` (down ${-d})` : ''}, ${st.seed <= R.poTeams ? 'in playoff position' : `${Math.max(0, C.standings.find(r => r.seed === R.poTeams).w - st.w)} game${C.standings.find(r => r.seed === R.poTeams).w - st.w === 1 ? '' : 's'} out of the last playoff spot`}</small></div>`;
  const p = C.preview.find(m => m.h === id || m.a === id);
  let next = '';
  if (p) {
    const home = p.h === id, mp = home ? p.hProj : p.aProj, op = home ? p.aProj : p.hProj, opp = home ? p.a : p.h;
    const [w, l] = home ? p.h2h : [p.h2h[1], p.h2h[0]];
    next = `<div><span class="k">Week ${NW}</span><span class="v">vs ${esc(tm(opp).team)}</span><small>Projected ${f1(mp)} to ${f1(op)}. You're ${w}-${l} all-time against ${esc(first(tm(opp).owner))}${mp < 85 ? '. Check your lineup for empty or bye-week slots' : ''}</small></div>`;
  }
  let bet = '';
  const B = R.bets;
  if (B && +B.latest.y === YR) {
    const wkB = B.seasons[B.latest.y].at(-1), pk = wkB.picks.find(x => x.o === ME);
    bet = `<div><span class="k">Bet, week ${wkB.wk}</span><span class="v">${pk && pk.pick ? esc(pk.pick) : 'No pick yet'}</span><small>${pk && pk.r ? ({ hit: 'Hit', miss: 'Missed', push: 'Push' }[pk.r] || '') : pk && pk.pick ? (pk.t || '') : 'Add it to the bet doc'}</small></div>`;
  }
  return `<section class="mine" aria-label="Your week"><h2>${av(t.team, id)}${esc(t.team)}</h2><div class="mine-grid">${last}${rank}${next}${bet}</div></section>`;
}

function bracketBlock(){
  const weeks = [...new Set(C.bracket.map(g => g[0]))].sort((a, b) => a - b);
  const names = ['Final', 'Semifinals', 'Quarterfinals'];
  const rounds = weeks.map((w, i) => {
    const label = names[weeks.length - 1 - i] || `Week ${w}`;
    const games = C.bracket.filter(g => g[0] === w).map(([, h, hp, a, ap, win]) => {
      if (a == null) return `<article class="game" ${dO(tm(h).owner)}><div class="side">${av(tm(h).team, h)}<span class="tn">${esc(tm(h).team)}</span><span class="on">${esc(tm(h).owner)}, bye</span></div></article>`;
      const s = (id, p, won) => `<div class="side ${win === 'U' || won ? '' : 'lose'}">${av(tm(id).team, id)}<span class="tn">${esc(tm(id).team)}</span><span class="on">${esc(tm(id).owner)}, ${ord(tm(id).seed)} seed</span><span class="sc num">${p == null ? '' : f2(p)}</span></div>`;
      return `<article class="game" ${dO(tm(h).owner)} data-o2="${esc(tm(a).owner)}">${s(h, hp, win === 'H')}${s(a, ap, win === 'A')}</article>`;
    }).join('');
    return `<div class="round"><h3>${label}, Week ${w}</h3>${games}</div>`;
  }).join('');
  return blk(`${YR} playoffs`, '', `<div class="bracket">${rounds}</div>`);
}

/* ================= WEEKLY BET ================= */
function renderBets(){
  const el = document.getElementById('p-bets');
  const B = R.bets;
  if (!B) { el.innerHTML = blk('Weekly bet', '', '<p class="note">The bet doc could not be read on the last update.</p>'); return; }
  const chipT = t => t ? `<span class="chip">${esc(t)}</span>` : '';
  const chipR = r => r === 'hit' ? '<span class="chip w">Hit</span>' : r === 'miss' ? '<span class="chip l">Miss</span>' : r === 'push' ? '<span class="chip">Push</span>' : '';
  const statusTxt = wk => wk.status === 'bust' ? `<span class="chip l">Busted</span> <span>Missed by ${wk.missedBy.map(esc).join(', ')}</span>`
    : wk.status === 'hit' ? '<span class="chip w">Parlay hit</span> <span>Every leg cashed</span>'
    : `<span class="chip">Not graded</span> <span>${wk.hits + wk.misses + (wk.pushes || 0) ? `${wk.hits} hit, ${wk.misses} missed${wk.pushes ? `, ${wk.pushes} push${wk.pushes > 1 ? 'es' : ''}` : ''} so far` : 'No results marked in the doc yet'}</span>`;
  const L = B.latest, wkL = B.seasons[L.y].at(-1);
  const blanks = wkL.picks.filter(p => !p.pick).map(p => p.o);
  const latest = `<div class="status"><b>Week ${wkL.wk}, ${L.y}</b>${statusTxt(wkL)}</div>
    <div class="picks">${wkL.picks.filter(p => p.pick).map(p => `<div class="pk" ${dO(p.o)}><span class="who">${esc(p.o)}</span><span class="what">${esc(p.pick)}</span><span class="tags">${chipT(p.t)}${chipR(p.r)}</span></div>`).join('')}</div>
    ${blanks.length ? `<p class="note">No pick: ${blanks.map(esc).join(', ')}</p>` : ''}`;

  let yr = L.y;
  const top = `<div class="rec"><ol>${B.top.map(t => `<li><span class="val num">${t.n}</span><span class="txt">${esc(t.s)}<small>${t.people === 1 ? `All by ${esc(t.by[0])}` : t.by[1] > 1 ? `${t.by[1]} by ${esc(t.by[0])}, ${t.people - 1} other${t.people > 2 ? 's' : ''}` : `${t.people} different people`}</small></span></li>`).join('')}</ol></div>`;
  const maxT = B.types[0][1];
  const mix = `<div class="bars">${B.types.map(([t, n], i) => `<div class="bar ${i === 0 ? 'top' : ''}"><span class="lbl">${esc(t)} <span>${Math.round(n / B.total * 100)}%</span></span><span class="val num">${n}</span><span class="track"><i style="width:${(n / maxT * 100).toFixed(1)}%"></i></span></div>`).join('')}</div>`;

  function board(){
    const rows = B.stats[yr];
    return `<div class="tbl-wrap"><table class="sticky1"><caption class="sr">Bet board</caption><thead><tr><th class="l" scope="col">Owner</th><th scope="col">Picks</th><th scope="col">Graded W-L</th><th class="l" scope="col">Go-to bet</th><th class="l" scope="col">Signature pick</th></tr></thead><tbody>${
      [...rows].sort((a, b) => (b.hits - b.misses) - (a.hits - a.misses) || b.made - a.made).map(r => `<tr ${dO(r.o)}><td class="l"><b>${esc(r.o)}</b></td><td>${r.made}<span class="muted">/${r.weeks}</span></td><td>${r.hits + r.misses ? `${r.hits}-${r.misses}` : '<span class="muted">–</span>'}</td><td class="l">${r.fav ? `${esc(r.fav[0])} <span class="muted">×${r.fav[1]}</span>` : '–'}</td><td class="l">${r.sig ? `${esc(r.sig[0])} <span class="muted">×${r.sig[1]}</span>` : '<span class="muted">–</span>'}</td></tr>`).join('')
    }</tbody></table></div>`;
  }
  function grid(){
    if (yr === 'all') return '';
    const weeks = B.seasons[yr];
    const owners = [...new Set(weeks.flatMap(w => w.picks.map(p => p.o)))];
    const cell = (wk, o) => { const p = wk.picks.find(x => x.o === o); if (!p || !p.pick) return '<td class="p none">–</td>';
      return `<td class="p ${p.r || ''}" title="${esc(p.pick)}">${esc(p.pick)}${p.r ? `<span class="sr"> (${p.r})</span>` : ''}</td>`; };
    const st = wk => wk.status === 'bust' ? '<span class="chip l">Bust</span>' : wk.status === 'hit' ? '<span class="chip w">Hit</span>' : '';
    return blk(`${yr} week by week`, 'Green cells hit, red cells missed, grey cells pushed, plain cells have no result marked.',
      `<div class="tbl-wrap"><table class="grid sticky1"><caption class="sr">Every pick in ${yr}</caption><thead><tr><th class="l" scope="col">Owner</th>${[...weeks].reverse().map(w => `<th class="l" scope="col">Wk ${w.wk} ${st(w)}</th>`).join('')}</tr></thead><tbody>${
        owners.map(o => `<tr ${dO(o)}><th class="l" scope="row"><b>${esc(o)}</b></th>${[...weeks].reverse().map(w => cell(w, o)).join('')}</tr>`).join('')
      }</tbody></table></div>`);
  }
  function draw(focus){
    const yrs = [...B.years, 'all'];
    el.innerHTML = blk('Latest picks', `Pulled from the <a href="${esc(B.docUrl)}" target="_blank" rel="noopener">league bet doc</a>. Put ✅ or ❌ (➖ for a push) after a pick in the doc and it counts here on the next update. ${B.graded} of ${B.total} picks have a result so far.`, latest) +
      `<div class="seg" role="group" aria-label="Season">${yrs.map(y => `<button type="button" aria-pressed="${y === yr}" data-y="${y}">${y === 'all' ? 'All seasons' : y}</button>`).join('')}</div>` +
      blk('Bet board', '"Picks" counts weeks with a pick out of weeks on the sheet. Go-to bet is the type each person picks most.', board()) +
      grid() +
      `<div class="two">${blk('Most backed', 'Players and teams picked most often, all seasons.', top)}${blk('Bet mix', 'Every pick on the sheet, by type.', mix)}</div>`;
    el.querySelectorAll('.seg button').forEach(b => b.addEventListener('click', () => { yr = b.dataset.y; draw(true); }));
    if (focus) el.querySelector(`.seg button[data-y="${yr}"]`).focus();
    markMe();
  }
  draw(false);
}

/* ================= TROPHY ROOM ================= */
function renderTrophies(){
  const plaques = [...done].reverse().map(s => `<article class="plaque" ${dO(s.champ.owner)}>
    <div class="yr"><svg viewBox="0 0 64 64" aria-hidden="true"><path d="M20 14h24v8a12 12 0 0 1-24 0z" fill="#DDB862"/><path d="M20 18h-6a6 6 0 0 0 6 8M44 18h6a6 6 0 0 1-6 8" stroke="#DDB862" stroke-width="3" fill="none"/><rect x="29" y="33" width="6" height="9" fill="#DDB862"/><rect x="21" y="42" width="22" height="7" rx="2" fill="#DDB862"/></svg>${s.year}</div>
    <h3 class="ch">${esc(s.champ.team)}</h3>
    <div class="who">${esc(s.champ.owner)}, ${s.champ.rec}, ${ord(s.champ.seed)} seed</div>
    ${s.final ? `<div class="fin num">Won the final ${f2(s.final[0])} to ${f2(s.final[1])}</div>` : ''}
    <dl><dt>Runner-up</dt><dd>${esc(s.runner.owner)}</dd><dt>Third</dt><dd>${esc(s.third.owner)}</dd>
    <dt>Top seed</dt><dd>${esc(s.topSeed.owner)} (${s.topSeed.rec})</dd><dt>Most points</dt><dd>${esc(s.topPF.owner)} (${f1(s.topPF.pf)})</dd>
    <dt>Last place</dt><dd>${esc(s.last.owner)}</dd></dl></article>`).join('');

  const cols = [['name','Owner','l'],['titles','Titles'],['finals','Finals'],['po_apps','Playoffs'],['rec','Record'],['pct','Win %'],['ppg','Pts/gm'],
    ['po','Playoff W-L'],['avg_finish','Avg finish'],['best','Best'],['lasts','Last place'],['moves','Moves'],['trades','Trades']];
  const asc = new Set(['name','avg_finish','best','lasts']);
  let sortKey = null, dir = -1;
  const val = (o, k) => k === 'rec' ? o.pct : k === 'po' ? o.po_w - o.po_l : k === 'best' ? (o.best || 99) : k === 'avg_finish' ? (o.avg_finish ?? 99) : o[k];
  const el = document.getElementById('p-trophies');
  function table(){
    const rows = [...R.ownerTable];
    if (sortKey) rows.sort((a, b) => { const x = val(a, sortKey), y = val(b, sortKey); return (x > y ? 1 : x < y ? -1 : 0) * dir; });
    return `<div class="tbl-wrap"><table class="sticky1"><caption class="sr">All-time standings</caption><thead><tr>${cols.map(([k, l, c]) =>
      `<th class="sortable ${c || ''}" scope="col" data-k="${k}" tabindex="0" ${sortKey === k ? `aria-sort="${dir > 0 ? 'ascending' : 'descending'}"` : ''}>${l}${sortKey === k ? (dir > 0 ? ' ▲' : ' ▼') : ''}</th>`).join('')}</tr></thead><tbody>${
      rows.map(o => `<tr ${dO(o.name)}><td class="l"><b>${esc(o.name)}</b></td><td class="titles">${o.titles ? '★'.repeat(o.titles) : '<span class="muted">0</span>'}</td><td>${o.finals}</td><td>${o.po_apps}/${o.done}</td><td>${o.w}-${o.l}${o.t ? '-' + o.t : ''}</td><td>${pct(o.pct)}</td><td>${f1(o.ppg)}</td><td>${o.po_w}-${o.po_l}</td><td>${o.avg_finish == null ? '–' : f1(o.avg_finish)}</td><td>${o.best ? ord(o.best) : '–'}</td><td>${o.lasts}</td><td>${o.moves}</td><td>${o.trades}</td></tr>`).join('')
    }</tbody></table></div>`;
  }
  function draw(){
    el.innerHTML = blk('Champions', '', `<div class="plaques">${plaques}</div>`) +
      blk('All-time standings', `Record and scoring are regular season, including ${YR} so far. Titles, finals and finishes count completed seasons. Tap a column to sort.`, table());
    el.querySelectorAll('th.sortable').forEach(th => {
      const go = () => { const k = th.dataset.k; if (sortKey === k) dir = -dir; else { sortKey = k; dir = asc.has(k) ? 1 : -1; } draw(); el.querySelector(`th[data-k="${k}"]`).focus(); };
      th.addEventListener('click', go); th.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); go(); } });
    });
    markMe();
  }
  draw();
}

/* ================= RECORD BOOK ================= */
function renderRecords(){
  const X = R.records;
  const when = r => `${r.y} Week ${r.wk}${r.po ? ', playoffs' : ''}`;
  const card = (title, items) => `<div class="rec"><h3>${title}</h3><ol>${items.join('')}</ol></div>`;
  const li = (o, v, main, sub) => `<li ${dO(o)}><span class="val num">${v}</span><span class="txt">${main}<small>${sub}</small></span></li>`;
  const games = (arr, v) => arr.map(r => li(r.owner, v(r), `${esc(r.owner)}<span class="muted">, ${esc(r.team)}</span>`, `${when(r)} vs ${esc(r.oppOwner)} (${f2(r.oppPts)})`));
  const margins = arr => arr.map(r => li(r.owner, '+' + f2(r.margin), `${esc(r.owner)} over ${esc(r.oppOwner)}`, `${when(r)}, ${f2(r.pts)} to ${f2(r.oppPts)}`));
  const seasons = (arr, v, sub) => arr.map(r => li(r.owner, v(r), `${esc(r.owner)}<span class="muted">, ${esc(r.team)}</span>`, `${r.y}: ${sub(r)}`));
  const recTxt = r => `${r.w}-${r.l}, ${f1(r.ppg)} per game, finished ${ord(r.rank)}`;
  const fin = r => `${r.w}-${r.l}, finished ${ord(r.rank)}`;
  const streaks = arr => arr.map(r => li(r.owner, r.len, esc(r.owner), `${r.from} to ${r.to}${r.live ? ' (still going)' : ''}`));
  const luck = arr => arr.map(r => li(r.owner, sgn(r.luck), `${esc(r.owner)}<span class="muted">, ${esc(r.team)}</span>`, `${r.y}: won ${r.w}, all-play pace was ${f1(r.exp)}`));
  document.getElementById('p-records').innerHTML =
    blk('Single game', `Regular season and championship bracket, ${R.seasons[0].year} to now.`, `<div class="recgrid">${[
      card('Highest score', games(X.high, r => f2(r.pts))), card('Lowest score', games(X.low, r => f2(r.pts))),
      card('Biggest blowout', margins(X.blowout)), card('Closest game', margins(X.close)),
      card('Most points in a loss', games(X.highLoss, r => f2(r.pts))), card('Fewest points in a win', games(X.lowWin, r => f2(r.pts))),
    ].join('')}</div>`) +
    blk('Season', 'Completed regular seasons, scored per game so shorter seasons compare fairly.', `<div class="recgrid">${[
      card('Best record', seasons(X.bestSeason, r => `${r.w}-${r.l}`, recTxt)), card('Worst record', seasons(X.worstSeason, r => `${r.w}-${r.l}`, recTxt)),
      card('Most points per game', seasons(X.mostPF, r => f1(r.ppg), recTxt)), card('Fewest points per game', seasons(X.fewestPF, r => f1(r.ppg), recTxt)),
      card('Most points against per game', seasons(X.mostPA, r => f1(r.papg), fin)),
      card('Luckiest season', luck(X.lucky)), card('Unluckiest season', luck(X.unlucky)),
      card('Most waiver moves', seasons(X.mostMoves, r => r.moves, fin)), card('Most trades', seasons(X.mostTrades, r => r.trades, fin)),
    ].join('')}</div>`) +
    blk('Streaks', 'Consecutive regular-season games, carried across seasons.', `<div class="recgrid">${[
      card('Longest winning streak', streaks(X.winStreak)), card('Longest losing streak', streaks(X.loseStreak)),
    ].join('')}</div>`);
}

/* ================= RIVALRIES ================= */
function renderRivalries(){
  const M = R.h2h;
  const mx = `<div class="tbl-wrap"><table class="mx sticky1"><caption class="sr">Head-to-head records, row owner first</caption><thead><tr><th class="l" scope="col">Record of</th>${OWN.map(n => `<th class="v" scope="col">${esc(n)}</th>`).join('')}<th scope="col">Total</th></tr></thead><tbody>${
    OWN.map((n, i) => { let tw = 0, tl = 0; const cells = OWN.map((_, j) => {
      if (i === j) return `<td class="c self" aria-label="same owner"></td>`;
      const [w, l] = M[i][j]; tw += w; tl += l; const g = w + l; if (!g) return `<td class="c muted">–</td>`;
      const share = w / g, mix = Math.round(Math.abs(share - .5) * 2 * 50), col = share >= .5 ? 'var(--win)' : 'var(--loss)';
      return `<td class="c" style="background:color-mix(in srgb,${col} ${mix}%,var(--surface))">${w}-${l}</td>`; }).join('');
      return `<tr ${dO(n)}><th class="l" scope="row"><b>${esc(n)}</b></th>${cells}<td><b>${tw}-${tl}</b></td></tr>`; }).join('')
  }</tbody></table></div>`;
  const L = R.rivals;
  const list = (arr, fmt) => `<ol>${arr.map(fmt).join('')}</ol>`;
  const lops = list(L.lopsided, r => `<li><span class="val num">${r.w}-${r.l}</span><span class="txt">${esc(r.a)} over ${esc(r.b)}<small>${r.g} games${r.po ? `, ${r.po} in the playoffs` : ''}</small></span></li>`);
  const most = list(L.mostPlayed, r => `<li><span class="val num">${r.g}</span><span class="txt">${esc(r.a)} vs ${esc(r.b)}<small>${esc(first(r.a))} leads ${r.w}-${r.l}${r.po ? `, ${r.po} playoff meetings` : ''}</small></span></li>`);
  const pom = list(L.playoff, r => `<li><span class="val num">${r.po}</span><span class="txt">${esc(r.a)} vs ${esc(r.b)}<small>playoff meetings, ${r.g} games overall</small></span></li>`);
  const opts = OWN.map((n, i) => `<option value="${i}">${esc(n)}</option>`).join('');
  const el = document.getElementById('p-rivalries');
  el.innerHTML =
    blk('Look up a rivalry', '', `<div class="picker"><select id="rv-a" aria-label="First owner">${opts}</select><span class="muted">vs</span><select id="rv-b" aria-label="Second owner">${opts}</select></div><div id="rv-out" aria-live="polite"></div>`) +
    `<div class="recgrid"><div class="rec"><h3>Most one-sided (6+ games)</h3>${lops}</div><div class="rec"><h3>Most played</h3>${most}</div><div class="rec"><h3>Playoff rivalries</h3>${pom}</div></div>` +
    blk('Every matchup', 'Each owner\'s record against every other owner. Read across a row.', mx);
  const a = el.querySelector('#rv-a'), b = el.querySelector('#rv-b'), out = el.querySelector('#rv-out');
  // default: you vs the owner you've played most, otherwise last year's final
  const meI = OWN.indexOf(ME);
  if (meI >= 0) {
    const opp = OWN.map((_, j) => j === meI ? -1 : M[meI][j][0] + M[meI][j][1]);
    a.value = String(meI); b.value = String(opp.indexOf(Math.max(...opp)));
  } else {
    const last = done.at(-1);
    a.value = String(OWN.indexOf(last.champ.owner)); b.value = String(OWN.indexOf(last.runner.owner));
  }
  function draw(){
    const i = +a.value, j = +b.value;
    if (i === j) { out.innerHTML = '<p class="note">Pick two different owners.</p>'; return; }
    const lo = Math.min(i, j), hi = Math.max(i, j);
    const rows = (R.pairs[`${lo}-${hi}`] || []).map(g => ({ y: g[0], wk: g[1], po: g[2], pi: lo === i ? g[3] : g[4], pj: lo === i ? g[4] : g[3] }));
    if (!rows.length) { out.innerHTML = '<p class="note">These two have never played each other.</p>'; return; }
    const w = rows.filter(r => r.pi > r.pj).length, l = rows.filter(r => r.pi < r.pj).length;
    const tpi = rows.reduce((s, r) => s + r.pi, 0), tpj = rows.reduce((s, r) => s + r.pj, 0);
    out.innerHTML = `<div class="career" style="margin-top:12px">
      <div class="stat"><div class="k">${esc(first(OWN[i]))}'s record</div><div class="v num">${w}-${l}</div></div>
      <div class="stat"><div class="k">${esc(first(OWN[i]))} avg</div><div class="v num">${f1(tpi / rows.length)}</div></div>
      <div class="stat"><div class="k">${esc(first(OWN[j]))} avg</div><div class="v num">${f1(tpj / rows.length)}</div></div>
      <div class="stat"><div class="k">Avg margin</div><div class="v num">${sgn((tpi - tpj) / rows.length)}</div></div></div>
      <div class="tbl-wrap" style="margin-top:12px"><table><caption class="sr">Every game between ${esc(OWN[i])} and ${esc(OWN[j])}</caption><thead><tr><th class="l" scope="col">Game</th><th scope="col">${esc(OWN[i])}</th><th scope="col">${esc(OWN[j])}</th><th scope="col">Result</th></tr></thead><tbody>${
        [...rows].reverse().map(r => `<tr><td class="l">${r.y} Week ${r.wk}${r.po ? ' <span class="chip">playoffs</span>' : ''}</td><td>${f2(r.pi)}</td><td>${f2(r.pj)}</td><td><span class="chip ${r.pi > r.pj ? 'w' : 'l'}">${r.pi > r.pj ? 'W' : 'L'}</span></td></tr>`).join('')
      }</tbody></table></div>`;
  }
  a.addEventListener('change', draw); b.addEventListener('change', draw); draw();
}

/* ================= DRAFTS ================= */
function renderDrafts(){
  const years = Object.keys(R.draft).sort();
  let yr = years.at(-1);
  const el = document.getElementById('p-drafts');
  function draw(focusYear){
    const d = R.draft[yr], teams = R.draftTeams[yr], partial = +yr === YR && !C.seasonDone;
    const who = id => teams[String(id)];
    const spots = v => (v > 0 ? '+' : '−') + Math.abs(v);
    const pLi = p => `<li ${dO(who(p[4]).owner)}><span class="val num">${p[7] != null ? spots(p[7]) : f1(p[5])}</span><span class="txt">${esc(p[0])} <span class="muted">${p[1]}</span><small>${esc(who(p[4]).owner)} took him in round ${p[2]}, pick ${p[3]}; finished ${ord(p[6])} with ${f1(p[5])} pts</small></span></li>`;
    const ranked = (d.steals[0] || [])[7] != null;
    const maxH = d.haul[0][1];
    const haul = d.haul.map((h, i) => `<div class="bar ${i === 0 ? 'top' : ''}" ${dO(who(h[0]).owner)}><span class="lbl">${esc(who(h[0]).owner)} <span>${esc(who(h[0]).team)}</span></span><span class="val num">${f1(h[1])}</span><span class="track"><i style="width:${(h[1] / maxH * 100).toFixed(1)}%"></i></span></div>`).join('');
    const firsts = `<div class="tbl-wrap"><table class="sticky1"><caption class="sr">Round 1 picks</caption><thead><tr><th class="l" scope="col">Player</th><th scope="col">Pick</th><th class="l" scope="col">Drafted by</th><th scope="col">Points</th><th scope="col">Finish</th></tr></thead><tbody>${
      d.firsts.map(p => `<tr ${dO(who(p[3]).owner)}><td class="l"><b>${esc(p[0])}</b> <span class="muted">${p[1]}</span></td><td>${p[2]}</td><td class="l">${esc(who(p[3]).owner)}</td><td>${f1(p[4])}</td><td>${p[5] ? ord(p[5]) : '–'}</td></tr>`).join('')
    }</tbody></table></div>`;
    el.innerHTML = `<div class="seg" role="group" aria-label="Draft year">${years.map(y => `<button type="button" aria-pressed="${y === yr}" data-y="${y}">${y}</button>`).join('')}</div>` +
      (partial ? `<p class="note">${yr} numbers are season to date through Week ${LW}.</p>` : '') +
      `<div class="two">${blk('Steals', ranked ? 'Round 4 or later. The number is how many spots higher he finished than where he was drafted.' : 'Round 4 or later. Players who most outscored their draft slot.', `<div class="rec"><ol>${d.steals.map(pLi).join('')}</ol></div>`)}${
        blk('Busts', ranked ? 'Rounds 1 to 3. The number is how many spots lower he finished than where he was drafted.' : 'Rounds 1 to 3. Players who fell furthest short of their draft slot.', `<div class="rec"><ol>${d.busts.map(pLi).join('')}</ol></div>`)}</div>` +
      blk('Round 1', 'Finish ranks each player by fantasy points among everyone drafted that year, kickers and defenses excluded.', firsts) +
      blk('Draft haul', 'Total fantasy points scored by every player each owner drafted, no matter who rostered him later.', `<div class="bars">${haul}</div>`);
    el.querySelectorAll('.seg button').forEach(bn => bn.addEventListener('click', () => { yr = bn.dataset.y; draw(true); }));
    if (focusYear) el.querySelector(`.seg button[data-y="${yr}"]`).focus();
    markMe();
  }
  draw(false);
}

/* ================= OWNERS ================= */
function renderOwners(){
  const el = document.getElementById('p-owners');
  el.innerHTML = `<div class="picker"><label class="sr" for="ow-pick">Owner</label><select id="ow-pick">${R.ownerTable.map(o => `<option value="${o.oi}">${esc(o.name)}</option>`).join('')}</select></div><div id="ow-out" style="display:grid;gap:24px" aria-live="polite"></div>`;
  const pick = el.querySelector('#ow-pick'), out = el.querySelector('#ow-out');
  const meI = OWN.indexOf(ME);
  pick.value = String(meI >= 0 ? meI : R.ownerTable[0].oi);
  function draw(){
    const i = +pick.value, o = R.ownerTable.find(x => x.oi === i), H = R.hist[String(i)];
    const stats = [['Titles', o.titles], ['Finals', o.finals], ['Playoffs', `${o.po_apps} of ${o.done}`], ['Record', `${o.w}-${o.l}`],
      ['Win %', pct(o.pct)], ['Pts/game', f1(o.ppg)], ['Playoff W-L', `${o.po_w}-${o.po_l}`], ['Avg finish', o.avg_finish == null ? '–' : f1(o.avg_finish)]]
      .map(([k, v]) => `<div class="stat"><div class="k">${k}</div><div class="v num">${v}</div></div>`).join('');
    const seasons = `<div class="tbl-wrap"><table><caption class="sr">Season by season</caption><thead><tr><th class="l" scope="col">Season</th><th class="l" scope="col">Team</th><th scope="col">Record</th><th scope="col">PF</th><th scope="col">Seed</th><th scope="col">Finish</th></tr></thead><tbody>${
      [...H].reverse().map(h => `<tr><td class="l">${h.y}</td><td class="l">${esc(h.team)}</td><td>${h.rec}</td><td>${f1(h.pf)}</td><td>${h.seed}${h.rank && !h.po ? ' <span class="muted">missed</span>' : ''}</td><td>${h.rank ? (h.rank === 1 ? '<span class="titles">★ Champion</span>' : ord(h.rank)) : '<span class="muted">in progress</span>'}</td></tr>`).join('')
    }</tbody></table></div>`;
    const vs = OWN.map((n, j) => j === i ? null : { n, w: R.h2h[i][j][0], l: R.h2h[i][j][1] }).filter(Boolean)
      .sort((a, b) => (b.w - b.l) - (a.w - a.l) || (b.w + b.l) - (a.w + a.l));
    const vsHtml = `<div class="tbl-wrap"><table><caption class="sr">Record against each owner</caption><thead><tr><th class="l" scope="col">Opponent</th><th scope="col">Record</th><th scope="col">Win %</th></tr></thead><tbody>${
      vs.map(v => { const g = v.w + v.l; return `<tr><td class="l">${esc(v.n)}</td><td><b>${v.w}-${v.l}</b></td><td class="${g && v.w / g > .5 ? 'pos' : g && v.w / g < .5 ? 'neg' : ''}">${g ? pct(v.w / g) : '–'}</td></tr>`; }).join('')
    }</tbody></table></div>`;
    const curEntry = Object.entries(T).find(([, t]) => t.owner === o.name), curT = curEntry ? curEntry[1] : null;
    const head = `<div class="profile">${curT ? av(curT.team, +curEntry[0]) : ''}<div><h2>${esc(o.name)}</h2><p>${curT ? `${esc(curT.team)}, ${YR}` : `Last played in ${H.at(-1).y}`}${o.titles ? `. ${o.titles === 1 ? 'Champion' : `${o.titles}-time champion`}` : ''}</p></div></div>`;
    out.innerHTML = head + `<div class="career">${stats}</div>` + blk('Season by season', '', seasons) + blk('Against everyone', 'Best matchups first.', vsHtml);
  }
  pick.addEventListener('change', draw); draw();
}

/* ================= tabs ================= */
const views = ['week', 'bets', 'trophies', 'records', 'rivalries', 'drafts', 'owners'];
const renderers = { week: renderWeek, bets: renderBets, trophies: renderTrophies, records: renderRecords, rivalries: renderRivalries, drafts: renderDrafts, owners: renderOwners };
const rendered = {};
const tabs = [...document.querySelectorAll('.tab')];
function show(v, focusTab){
  if (!views.includes(v)) v = 'week';
  if (!rendered[v]) { renderers[v](); rendered[v] = true; }
  views.forEach(x => {
    document.getElementById('p-' + x).hidden = x !== v;
    const t = document.getElementById('tab-' + x);
    t.setAttribute('aria-selected', String(x === v)); t.tabIndex = x === v ? 0 : -1;
  });
  if (focusTab) document.getElementById('tab-' + v).focus();
  document.getElementById('tab-' + v).scrollIntoView({ block: 'nearest', inline: 'nearest' });
  markMe();
  try { history.replaceState(null, '', '#' + v); } catch (e) {}
}
tabs.forEach((t, i) => {
  t.addEventListener('click', () => { const top = document.querySelector('.tabs').offsetTop; show(t.dataset.tab); if (window.scrollY > top) window.scrollTo({ top }); });
  t.addEventListener('keydown', e => {
    const k = e.key; let n = null;
    if (k === 'ArrowRight') n = (i + 1) % tabs.length; else if (k === 'ArrowLeft') n = (i - 1 + tabs.length) % tabs.length;
    else if (k === 'Home') n = 0; else if (k === 'End') n = tabs.length - 1;
    if (n != null) { e.preventDefault(); show(tabs[n].dataset.tab, true); }
  });
});
window.addEventListener('hashchange', () => show(location.hash.slice(1)));
renderTicker();
show(location.hash.slice(1));
})();
</script>
