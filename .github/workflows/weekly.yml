name: Update corknpork.net

on:
  schedule:
    - cron: '0 11 * * 2'   # Tuesday 11:00 UTC: after Monday Night Football
    - cron: '0 20 * * 4'   # Thursday 20:00 UTC: fresh projections and bet picks before kickoff
  workflow_dispatch:       # "Run workflow" button for a manual refresh
    inputs:
      test_alert:
        description: Also send a test message to Slack
        type: boolean
        default: false
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:  # read by the alert job
      espn: ${{ steps.espn.outcome }}
      bets: ${{ steps.bets.outcome }}
      compute: ${{ steps.compute.outcome }}
      card: ${{ steps.card.outcome }}
      page: ${{ steps.page.outcome }}
      save: ${{ steps.save.outcome }}
      alerts: ${{ steps.alerts.outputs.text }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Pull league data from ESPN
        id: espn
        env:
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          SWID: ${{ secrets.SWID }}
          # Pushes and manual runs may build from the saved data if the secrets aren't set yet; scheduled runs must fetch.
          ALLOW_STALE: ${{ github.event_name != 'schedule' && '1' || '0' }}
        run: node scripts/fetch.js data/league.json

      - name: Pull the weekly bet doc
        id: bets
        run: python3 scripts/bets.py

      - name: Compute stats
        id: compute
        run: python3 scripts/compute.py data/league.json build/results.json

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Draw the link-preview card and icons
        id: card
        continue-on-error: true   # the page still builds (without a preview image) if this fails
        run: |
          python -m pip install --quiet pillow
          python scripts/og.py build/results.json _site

      - name: Build the page
        id: page
        run: python3 scripts/build.py build/results.json _site/index.html

      - name: Save the data snapshot
        id: save
        if: github.event_name != 'push'
        run: |
          git config user.name "corknpork bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Data update $(date -u +%Y-%m-%d)"
          git push

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Collect anything worth flagging
        id: alerts
        if: always()
        run: |
          if [ "${{ steps.card.outcome }}" = failure ]; then
            mkdir -p build && echo "The link-preview card didn't draw this time, so the site went out without it." >> build/alerts.txt
          fi
          { echo 'text<<END_OF_ALERTS'; cat build/alerts.txt 2>/dev/null || true; echo 'END_OF_ALERTS'; } >> "$GITHUB_OUTPUT"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  alert:  # posts to Slack when something breaks (needs the SLACK_WEBHOOK_URL secret)
    needs: [build, deploy]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Tell Slack about problems
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          BUILD_RESULT: ${{ needs.build.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          STEP_ESPN: ${{ needs.build.outputs.espn }}
          STEP_BETS: ${{ needs.build.outputs.bets }}
          STEP_COMPUTE: ${{ needs.build.outputs.compute }}
          STEP_PAGE: ${{ needs.build.outputs.page }}
          STEP_SAVE: ${{ needs.build.outputs.save }}
          ALERTS: ${{ needs.build.outputs.alerts }}
          TEST_ALERT: ${{ inputs.test_alert }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 scripts/notify.py
